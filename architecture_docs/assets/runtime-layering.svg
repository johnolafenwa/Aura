<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="360" viewBox="0 0 1400 360" role="img" aria-labelledby="title desc">
  <title id="title">Aurora runtime layering</title>
  <desc id="desc">Aurora has a shared runtime value layer used by both the MIR runtime and the native backend runtime.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2d3e50" />
    </marker>
    <style>
      .bg { fill: #f8fafc; }
      .box { fill: #ffffff; stroke: #2d3e50; stroke-width: 2; rx: 14; ry: 14; }
      .title { font: 700 20px 'Helvetica Neue', Arial, sans-serif; fill: #142033; }
      .label { font: 700 18px 'Helvetica Neue', Arial, sans-serif; fill: #142033; }
      .text { font: 14px 'Helvetica Neue', Arial, sans-serif; fill: #31445f; }
      .line { stroke: #2d3e50; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .accentA { fill: #e9f7ef; }
      .accentB { fill: #fff3dd; }
      .accentC { fill: #eaf0ff; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1400" height="360" />
  <text class="title" x="40" y="42">Aurora Runtime Layering</text>

  <rect class="box accentC" x="50" y="86" width="260" height="104" />
  <text class="label" x="122" y="122">MIR Runtime</text>
  <text class="text" x="78" y="146">Executes `MirModule` directly, block by block.</text>
  <text class="text" x="78" y="168">Handles cleanups, task-group starts, wait helpers, and builtins.</text>

  <rect class="box accentB" x="50" y="228" width="260" height="104" />
  <text class="label" x="90" y="264">Native Runtime ABI</text>
  <text class="text" x="78" y="288">Called by Cranelift-generated machine code.</text>
  <text class="text" x="78" y="310">Uses explicit refcounted opaque values.</text>

  <rect class="box accentA" x="390" y="86" width="330" height="246" />
  <text class="label" x="473" y="122">Shared Runtime Value Layer</text>
  <text class="text" x="418" y="148">`runtime_value.rs` defines Aurora values and resource wrappers:</text>
  <text class="text" x="418" y="174">scalars, class instances, enum variants, collections,</text>
  <text class="text" x="418" y="198">queues/tasks, files, TCP/UDP, HTTP, WebSocket, Unix, TLS.</text>
  <text class="text" x="418" y="228">It also owns the concrete blocking and poll-driven I/O behavior,</text>
  <text class="text" x="418" y="252">resource cleanup operations, cancellation plumbing, and helpers</text>
  <text class="text" x="418" y="276">for numeric casting, HTTP parsing, and network deadline handling.</text>

  <rect class="box" x="800" y="86" width="260" height="104" />
  <text class="label" x="837" y="122">Host Resources</text>
  <text class="text" x="828" y="146">Threads, mutexes, condvars, sockets, files,</text>
  <text class="text" x="828" y="168">TLS sessions, HTTP/WebSocket libraries.</text>

  <rect class="box" x="800" y="228" width="260" height="104" />
  <text class="label" x="844" y="264">Aurora Values</text>
  <text class="text" x="826" y="288">The language-level objects seen by user programs.</text>
  <text class="text" x="826" y="310">Both runtime paths preserve the same semantics.</text>

  <line class="line" x1="310" y1="138" x2="390" y2="138" />
  <line class="line" x1="310" y1="280" x2="390" y2="280" />
  <line class="line" x1="720" y1="138" x2="800" y2="138" />
  <line class="line" x1="720" y1="280" x2="800" y2="280" />
</svg>
