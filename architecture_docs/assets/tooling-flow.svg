<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="360" viewBox="0 0 1400 360" role="img" aria-labelledby="title desc">
  <title id="title">Aura editor and tooling flow</title>
  <desc id="desc">VS Code talks to a language server, which uses a persistent compiler service and lexical recovery only when that service is unavailable.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2d3e50" />
    </marker>
    <style>
      .bg { fill: #f7f9fc; }
      .box { fill: #ffffff; stroke: #2d3e50; stroke-width: 2; rx: 14; ry: 14; }
      .title { font: 700 20px 'Helvetica Neue', Arial, sans-serif; fill: #142033; }
      .label { font: 700 18px 'Helvetica Neue', Arial, sans-serif; fill: #142033; }
      .text { font: 14px 'Helvetica Neue', Arial, sans-serif; fill: #31445f; }
      .line { stroke: #2d3e50; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .accentA { fill: #eaf0ff; }
      .accentB { fill: #e9f7ef; }
      .accentC { fill: #fff3dd; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1400" height="360" />
  <text class="title" x="40" y="42">Aura Tooling Flow</text>

  <rect class="box accentA" x="60" y="110" width="220" height="100" />
  <text class="label" x="121" y="146">VS Code</text>
  <text class="text" x="91" y="170">Aura extension registers the language,</text>
  <text class="text" x="91" y="192">indentation handler, and LSP client.</text>

  <rect class="box accentA" x="350" y="110" width="220" height="100" />
  <text class="label" x="408" y="146">LSP Server</text>
  <text class="text" x="376" y="170">`server.js` handles diagnostics, hover,</text>
  <text class="text" x="376" y="192">definitions, symbols, and completions.</text>

  <rect class="box accentB" x="650" y="60" width="270" height="100" />
  <text class="label" x="700" y="96">Compiler Bridge</text>
  <text class="text" x="676" y="120">Persistent `aura lsp` JSON-lines service</text>
  <text class="text" x="676" y="142">against the active workspace compiler.</text>

  <rect class="box accentB" x="650" y="210" width="270" height="100" />
  <text class="label" x="699" y="246">JS Fallback Analyzer</text>
  <text class="text" x="676" y="270">A lightweight parser/symbol model used</text>
  <text class="text" x="676" y="292">when compiler analysis is unavailable.</text>

  <rect class="box accentC" x="1000" y="110" width="280" height="100" />
  <text class="label" x="1042" y="146">Aura Compiler</text>
  <text class="text" x="1027" y="170">Produces machine-readable diagnostics,</text>
  <text class="text" x="1027" y="192">symbols, hover, definition, completion data.</text>

  <line class="line" x1="280" y1="160" x2="350" y2="160" />
  <line class="line" x1="570" y1="160" x2="650" y2="110" />
  <line class="line" x1="570" y1="160" x2="650" y2="260" />
  <line class="line" x1="920" y1="110" x2="1000" y2="160" />

  <text class="text" x="1000" y="248">Preferred path: compiler-backed analysis.</text>
  <text class="text" x="1000" y="270">Recovery path: lexical declarations only if compiler unavailable.</text>
</svg>
