name: Safety and performance

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      RUSTUP_TOOLCHAIN: nightly-2026-07-01
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: nightly-2026-07-01
      - uses: taiki-e/install-action@c7eb1735f09259a5035e8e5d44b1406b1cddc0fb # v2
        with:
          tool: cargo-fuzz@0.13.2
      - run: cargo +nightly-2026-07-01 fuzz run --target x86_64-unknown-linux-gnu frontend -- -max_total_time=120 -timeout=10
      - run: cargo +nightly-2026-07-01 fuzz run --target x86_64-unknown-linux-gnu mir_runtime -- -max_total_time=120 -timeout=10

  native-runtime-asan:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: nightly-2026-07-01
          components: rust-src
      - run: scripts/sanitizer-native-runtime.sh x86_64-unknown-linux-gnu

  scheduler-tsan:
    name: Multicore scheduler ThreadSanitizer
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: nightly-2026-07-01
          components: rust-src
      - run: scripts/sanitizer-scheduler-tsan.sh x86_64-unknown-linux-gnu

  scheduler-stress-and-benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: 1.95.0
      # Ten repetitions exercise all three exact scheduler regressions while
      # retaining headroom inside the hosted runner's 45-minute job budget.
      - run: AURA_STRESS_RUNS=10 scripts/stress-scheduler.sh
      - run: npm run test:scheduler-model
      - run: cargo bench -p aura-compiler --bench compiler_pipeline | tee compiler-benchmark.jsonl
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: compiler-benchmark
          path: compiler-benchmark.jsonl
          if-no-files-found: error
