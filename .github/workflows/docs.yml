name: Docs

on:
  push:
    branches: [main]
    paths:
      - '**/*.md'
      - 'docs/**'
      - '!work/**'
      - '!.github/**'
      - '!AGENTS.md'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/docs.yml'
      - 'crates/**'
      - 'Cargo.lock'
      - 'scripts/check_doc_examples.py'
  pull_request:
    paths:
      - '**/*.md'
      - 'docs/**'
      - '!work/**'
      - '!.github/**'
      - '!AGENTS.md'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/docs.yml'
      - 'crates/**'
      - 'Cargo.lock'
      - 'scripts/check_doc_examples.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22.14.0
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Build docs
        env:
          VITEPRESS_BASE: /Aura/
        run: npm run docs:build

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: docs/.vitepress/dist

  examples:
    name: Compile documentation examples
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: 1.95.0

      - name: Build Aura
        run: cargo build -p aura

      - name: Check every aura code block
        run: python3 scripts/check_doc_examples.py

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
