name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'work/**'
      - 'LICENSE'
      - '.gitignore'
      - '.gitattributes'
      - '.editorconfig'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE*'
      - '.github/CODEOWNERS'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'work/**'
      - 'LICENSE'
      - '.gitignore'
      - '.gitattributes'
      - '.editorconfig'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE*'
      - '.github/CODEOWNERS'

permissions:
  contents: read

# A new push to a pull request replaces the run of the push before it.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: never

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    # The repo gate runs the whole workspace twice (tests, then the
    # single-threaded instrumented coverage run); after Batch 1 phase 1 the
    # Ubuntu runner needs about two hours for it, so the limit leaves
    # headroom.
    timeout-minutes: 210

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 2

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22.14.0
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: 1.95.0
          components: clippy, llvm-tools-preview, rustfmt

      - name: Install ripgrep
        uses: taiki-e/install-action@c7eb1735f09259a5035e8e5d44b1406b1cddc0fb # v2
        with:
          tool: ripgrep@14.1.1

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@c7eb1735f09259a5035e8e5d44b1406b1cddc0fb # v2
        with:
          tool: cargo-llvm-cov@0.8.4

      - name: Install cargo-audit
        uses: taiki-e/install-action@c7eb1735f09259a5035e8e5d44b1406b1cddc0fb # v2
        with:
          tool: cargo-audit@0.22.2

      - name: Install LLVM's system libraries
        if: runner.os == 'Linux'
        # The Linux llvm-config names a static libzstd and libxml2.
        run: sudo apt-get update && sudo apt-get install -y libzstd-dev libxml2-dev

      - name: Cache LLVM
        if: runner.os == 'Linux'
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.cache/aura/llvm/22.1.2
          key: llvm-22.1.2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/install-llvm.sh') }}

      - name: Install LLVM
        run: bash scripts/install-llvm.sh

      - name: Install Z3
        # `aura verify` and its tests run against one pinned solver.
        run: bash scripts/install-z3.sh

      - name: Install npm dependencies
        run: npm ci

      - name: Run repo gate
        run: npm run ci

  platform-tests:
    # Hosts that run the workspace tests without the coverage floors, which
    # are recorded on x86-64 Linux and arm64 macOS only.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 150

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: 1.95.0
          components: clippy, llvm-tools-preview, rustfmt

      - name: Install LLVM's system libraries
        if: runner.os == 'Linux'
        # The Linux llvm-config names a static libzstd and libxml2.
        run: sudo apt-get update && sudo apt-get install -y libzstd-dev libxml2-dev

      - name: Cache LLVM
        if: runner.os == 'Linux'
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.cache/aura/llvm/22.1.2
          key: llvm-22.1.2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/install-llvm.sh') }}

      - name: Install LLVM
        run: bash scripts/install-llvm.sh

      - name: Install Z3
        run: bash scripts/install-z3.sh

      - name: Run the workspace tests
        env:
          RUST_MIN_STACK: 33554432
        run: cargo test --locked

      - name: Compare the interpreter with native executables
        run: cargo test --locked -p aura --test backend_parity -- --ignored --test-threads=1 --nocapture

  windows:
    # Builds Aura on native Windows and runs the runtime, command and
    # compiler unit tests, a native build, the release archive and the
    # installer. `windows-integration` runs the integration suites.
    runs-on: windows-2025
    timeout-minutes: 150
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: 1.95.0
          components: clippy, llvm-tools-preview, rustfmt

      - name: Put the POSIX commands the tests spawn on PATH
        # Git for Windows carries `sh`, `echo`, `true` and the rest.
        run: echo "C:\\Program Files\\Git\\usr\\bin" >> "$GITHUB_PATH"

      - name: Cache LLVM
        if: ${{ !cancelled() }}
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.cache/aura/llvm/22.1.2
          key: llvm-22.1.2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/install-llvm.sh') }}

      - name: Install LLVM
        if: ${{ !cancelled() }}
        run: bash scripts/install-llvm.sh

      - name: Install Z3
        if: ${{ !cancelled() }}
        run: bash scripts/install-z3.sh 2>&1 | tee "$RUNNER_TEMP/z3-install.log"

      - name: Build the compiler and the aura command
        if: ${{ !cancelled() }}
        run: cargo build --locked -p aura 2>&1 | tee "$RUNNER_TEMP/aura-build.log"

      - name: Run a program in the interpreter and as a native executable
        if: ${{ !cancelled() }}
        timeout-minutes: 15
        run: |
          {
            target/debug/aura.exe run --backend mir examples/basics/hello_world.au
            target/debug/aura.exe build -o target/hello_world.exe examples/basics/hello_world.au
            target/hello_world.exe
            target/debug/aura.exe run --backend direct examples/control_flow.au
            target/debug/aura.exe run --backend direct examples/basic_addition.au
            target/debug/aura.exe run --backend direct examples/agents/retrying_network_worker.au
          } 2>&1 | tee "$RUNNER_TEMP/smoke.log"

      - name: Run the runtime tests
        if: ${{ !cancelled() }}
        # The tests take a few minutes. The limit turns a hung test into a
        # failure whose log names it.
        timeout-minutes: 12
        env:
          RUST_MIN_STACK: 33554432
        run: cargo test --locked -p aura-core -p aura-mem -p aura-runtime 2>&1 | tee "$RUNNER_TEMP/runtime-tests.log"

      - name: Run the aura command's unit tests
        if: ${{ !cancelled() }}
        timeout-minutes: 20
        env:
          RUST_MIN_STACK: 33554432
        run: cargo test --locked -p aura --bin aura 2>&1 | tee "$RUNNER_TEMP/command-tests.log"

      - name: Run the compiler's unit tests
        if: ${{ !cancelled() }}
        timeout-minutes: 45
        env:
          RUST_MIN_STACK: 33554432
        run: cargo test --locked -p aura-compiler --lib 2>&1 | tee "$RUNNER_TEMP/compiler-tests.log"

      - name: Package the release archive and run it outside the source tree
        if: ${{ !cancelled() }}
        timeout-minutes: 40
        run: |
          {
            cargo build --release --locked -p aura
            version="$(target/release/aura.exe --version | tr -d '\r' | awk '{ print $2 }')"
            archive="aura-v$version-x86_64-pc-windows-msvc"
            scripts/package-cli-windows.sh "$archive"
            scripts/smoke-cli-archive-windows.sh "$archive.zip"
            # Install the archive with the PowerShell installer, then build
            # and run a program with the installed command.
            mkdir -p "$RUNNER_TEMP/aura-release"
            cp "$archive.zip" "$RUNNER_TEMP/aura-release/"
            (cd "$RUNNER_TEMP/aura-release" && sha256sum "$archive.zip" > SHA256SUMS)
            AURA_INSTALL_RELEASE_TAG="v$version" \
              AURA_INSTALL_BASE_URL="file:///$(cygpath -m "$RUNNER_TEMP/aura-release")" \
              AURA_INSTALL_PREFIX="$(cygpath -w "$RUNNER_TEMP/aura-prefix")" \
              pwsh -NoProfile -File docs/public/install.ps1
            installed="$RUNNER_TEMP/aura-prefix/bin/aura.exe"
            "$installed" --version
            (cd "$RUNNER_TEMP" && "$installed" run --backend direct "$GITHUB_WORKSPACE/examples/basic_addition.au")
            # Build the Chocolatey package from the same archive, install
            # it, and build and run a program with the installed command.
            scripts/smoke-chocolatey.sh "$(scripts/package-chocolatey.sh "$archive.zip")"
          } 2>&1 | tee "$RUNNER_TEMP/package.log"

      - name: Show where a failed step stopped
        # The job log is long, so the failures are repeated at its end.
        if: ${{ failure() }}
        run: |
          grep -E "^error|^warning: unused|panicked" -A 12 "$RUNNER_TEMP/aura-build.log" | tail -n 40 || true
          tail -n 40 "$RUNNER_TEMP/smoke.log" || true
          grep -E "FAILED|failed|panicked|over 60 seconds|test result" "$RUNNER_TEMP/runtime-tests.log" | tail -n 60 || true
          grep -E "FAILED|failed|panicked|over 60 seconds|test result|^error" "$RUNNER_TEMP/command-tests.log" | tail -n 60 || true
          grep -E "FAILED|failed|over 60 seconds|test result|^error" "$RUNNER_TEMP/compiler-tests.log" | tail -n 60 || true
          grep -E "panicked at" -A 14 "$RUNNER_TEMP/compiler-tests.log" | grep -v "^--$" | cut -c 1-400 | head -n 200 || true
          grep -vE "^ +Compiling|^warning|^ *$" "$RUNNER_TEMP/package.log" | tail -n 40 || true
          grep -E "test result" "$RUNNER_TEMP/compiler-tests.log" || true
          tail -n 15 "$RUNNER_TEMP/z3-install.log" || true
          command -v z3 || echo "z3 is not on PATH"

  windows-integration:
    # The integration suites on native Windows: the `aura` command's, and
    # the compiler's and the runtime's. Each compiler suite links LLVM, so
    # the two groups run on separate machines.
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: command
            tests: -p aura --tests
          - suite: compiler
            tests: -p aura-compiler -p aura-runtime --test *
    name: windows-integration (${{ matrix.suite }})
    runs-on: windows-2025
    timeout-minutes: 150
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: 1.95.0

      - name: Put the POSIX commands the tests spawn on PATH
        # Git for Windows carries `sh`, `echo`, `true` and the rest.
        run: echo "C:\\Program Files\\Git\\usr\\bin" >> "$GITHUB_PATH"

      - name: Cache LLVM
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.cache/aura/llvm/22.1.2
          key: llvm-22.1.2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/install-llvm.sh') }}

      - name: Install LLVM
        run: bash scripts/install-llvm.sh

      - name: Install Z3
        run: bash scripts/install-z3.sh

      - name: Run the integration tests
        timeout-minutes: 120
        env:
          RUST_MIN_STACK: 33554432
          # Test programs without debug information stay small enough for
          # the runner's disk.
          CARGO_PROFILE_TEST_DEBUG: 0
          CARGO_PROFILE_DEV_DEBUG: 0
          SUITE_TESTS: ${{ matrix.tests }}
        run: |
          set -f
          cargo test --locked $SUITE_TESTS --no-fail-fast 2>&1 | tee "$RUNNER_TEMP/integration-tests.log"

      - name: Show the failures
        # The job log is long, so the failures are repeated at its end.
        if: ${{ failure() }}
        run: |
          grep -E "^error" -A 12 "$RUNNER_TEMP/integration-tests.log" | head -n 60 || true
          grep -E "panicked at" -A 40 "$RUNNER_TEMP/integration-tests.log" | grep -v "^--$" | cut -c 1-400 | head -n 200 || true
          grep -E "^test .* FAILED|over 60 seconds" "$RUNNER_TEMP/integration-tests.log" | cut -c 1-160 | head -n 120 || true
          grep -E "test result: FAILED" -B 1 "$RUNNER_TEMP/integration-tests.log" | cut -c 1-160 || true

  cross-targets:
    # `aura build --target` (ADR-0101): each Linux runner builds and runs a
    # program for the musl target of its own architecture and for the
    # glibc target of the other architecture, the latter under QEMU.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: 1.95.0
          targets: x86_64-unknown-linux-gnu,aarch64-unknown-linux-gnu,x86_64-unknown-linux-musl,aarch64-unknown-linux-musl

      - name: Install LLVM's system libraries and the target toolchains
        run: |
          case "$(uname -m)" in
            x86_64) cross=gcc-aarch64-linux-gnu ;;
            *) cross=gcc-x86-64-linux-gnu ;;
          esac
          sudo apt-get update
          sudo apt-get install -y libzstd-dev libxml2-dev musl-tools qemu-user-static "$cross"

      - name: Cache LLVM
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.cache/aura/llvm/22.1.2
          key: llvm-22.1.2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/install-llvm.sh') }}

      - name: Install LLVM
        run: bash scripts/install-llvm.sh

      - name: Build and run programs for the other targets
        run: |
          eval "$(scripts/cross-target-env.sh)"
          echo "targets: $AURA_TEST_CROSS_TARGETS"
          cargo test --locked -p aura --test cross_targets

  native-binaries:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: 1.95.0

      - name: Install LLVM's system libraries
        if: runner.os == 'Linux'
        # The Linux llvm-config names a static libzstd and libxml2.
        run: sudo apt-get update && sudo apt-get install -y libzstd-dev libxml2-dev

      - name: Cache LLVM
        if: runner.os == 'Linux'
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.cache/aura/llvm/22.1.2
          key: llvm-22.1.2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/install-llvm.sh') }}

      - name: Install LLVM
        run: bash scripts/install-llvm.sh

      - name: Build release compiler and runtime
        run: cargo build --release --locked -p aura -p aura-runtime

      - name: Check the libraries the compiler loads
        run: python3 scripts/check-aura-libraries.py target/release/aura

      - name: Check native executable contents and sizes
        run: python3 scripts/check-native-binaries.py

      - name: Package the release archive
        shell: bash
        run: |
          version="$(target/release/aura --version | awk '{ print $2 }')"
          case "$(uname -s)-$(uname -m)" in
            Linux-x86_64) target=x86_64-unknown-linux-gnu ;;
            Linux-aarch64) target=aarch64-unknown-linux-gnu ;;
            Darwin-arm64) target=aarch64-apple-darwin ;;
            Darwin-x86_64) target=x86_64-apple-darwin ;;
          esac
          scripts/package-cli.sh "aura-v$version-$target"
          echo "AURA_CI_ARCHIVE=aura-v$version-$target.tar.gz" >> "$GITHUB_ENV"

      # What `aura build --target` links for this architecture's Linux
      # targets (ADR-0101). The musl pack builds the runtime library again.
      - name: Package the target packs and build with the musl one
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get install -y musl-tools
          rustup target add "$(uname -m)-unknown-linux-musl"
          prefix="${AURA_CI_ARCHIVE%-$(uname -m)-unknown-linux-gnu.tar.gz}-target-$(uname -m)-unknown-linux"
          scripts/package-target.sh "$prefix-gnu"
          scripts/package-target.sh "$prefix-musl"
          scripts/smoke-target-packs.sh "$AURA_CI_ARCHIVE" "$prefix-musl.tar.gz"

      - name: Upload the archive and target packs
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: target-packs-${{ runner.arch }}
          path: aura-v*.tar.gz
          retention-days: 1
          if-no-files-found: error

      - name: Build the Debian package and install it with apt-get
        if: runner.os == 'Linux'
        shell: bash
        run: scripts/smoke-deb.sh "$(scripts/package-deb.sh "$AURA_CI_ARCHIVE")"

      - name: Install the Homebrew formula from a local tap
        if: runner.os == 'macOS'
        shell: bash
        run: scripts/smoke-homebrew.sh "$AURA_CI_ARCHIVE"

  # The x86-64 CLI builds for every Linux target it has no runtime library
  # for, with the packs both Linux runners made, and the arm64 programs run
  # under emulation.
  target-packs:
    needs: native-binaries
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Download the archives and target packs
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          pattern: target-packs-*
          path: packs
          merge-multiple: true

      - name: Install the arm64 link driver and emulator
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu qemu-user-static

      - name: Build and run programs for the other Linux targets
        shell: bash
        run: |
          archive="$(ls packs/aura-v*-x86_64-unknown-linux-gnu.tar.gz | grep -v -- -target-)"
          scripts/smoke-target-packs.sh \
            "$archive" \
            packs/aura-v*-target-x86_64-unknown-linux-musl.tar.gz \
            packs/aura-v*-target-aarch64-unknown-linux-gnu.tar.gz \
            packs/aura-v*-target-aarch64-unknown-linux-musl.tar.gz
