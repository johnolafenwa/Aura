name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: never

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22.14.0
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: 1.95.0
          components: clippy, llvm-tools-preview, rustfmt

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@c7eb1735f09259a5035e8e5d44b1406b1cddc0fb # v2
        with:
          tool: cargo-llvm-cov@0.8.4

      - name: Install cargo-audit
        uses: taiki-e/install-action@c7eb1735f09259a5035e8e5d44b1406b1cddc0fb # v2
        with:
          tool: cargo-audit@0.22.2

      - name: Install npm dependencies
        run: npm ci

      - name: Isolate macOS wall-clock assertions
        if: runner.os == 'macOS'
        run: echo "RUST_TEST_THREADS=1" >> "$GITHUB_ENV"

      - name: Run repo gate
        run: npm run ci
