name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'work/**'
      - 'LICENSE'
      - '.gitignore'
      - '.gitattributes'
      - '.editorconfig'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE*'
      - '.github/CODEOWNERS'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'work/**'
      - 'LICENSE'
      - '.gitignore'
      - '.gitattributes'
      - '.editorconfig'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE*'
      - '.github/CODEOWNERS'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: never

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    # The repo gate runs the whole workspace twice (tests, then the
    # single-threaded instrumented coverage run); after Batch 1 phase 1 the
    # Ubuntu runner needs about two hours for it. The LLVM parity matrix and
    # library tests add about half an hour, so the limit leaves headroom.
    timeout-minutes: 210

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 2

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22.14.0
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: 1.95.0
          components: clippy, llvm-tools-preview, rustfmt

      - name: Install ripgrep
        uses: taiki-e/install-action@c7eb1735f09259a5035e8e5d44b1406b1cddc0fb # v2
        with:
          tool: ripgrep@14.1.1

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@c7eb1735f09259a5035e8e5d44b1406b1cddc0fb # v2
        with:
          tool: cargo-llvm-cov@0.8.4

      - name: Install cargo-audit
        uses: taiki-e/install-action@c7eb1735f09259a5035e8e5d44b1406b1cddc0fb # v2
        with:
          tool: cargo-audit@0.22.2

      - name: Install LLVM's system libraries
        if: runner.os == 'Linux'
        # The Linux llvm-config names a static libzstd and libxml2.
        run: sudo apt-get update && sudo apt-get install -y libzstd-dev libxml2-dev

      - name: Install LLVM's system libraries
        if: runner.os == 'macOS'
        # The macOS llvm-config names Homebrew's static libzstd.
        run: brew list zstd >/dev/null 2>&1 || brew install zstd

      - name: Cache LLVM
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.cache/aura/llvm/22.1.2
          key: llvm-22.1.2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/install-llvm.sh') }}

      - name: Install LLVM
        run: bash scripts/install-llvm.sh

      - name: Install npm dependencies
        run: npm ci

      - name: Run repo gate
        run: npm run ci

  native-binaries:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: 1.95.0

      - name: Build release compiler and runtime
        run: cargo build --release --locked -p aura -p aura-runtime

      - name: Check native executable contents and sizes
        run: python3 scripts/check-native-binaries.py
