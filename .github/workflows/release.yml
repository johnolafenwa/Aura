name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish, such as v1.0.0'
        required: true

permissions:
  contents: read

jobs:
  cli:
    name: CLI (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-24.04
            archive: aurora-${{ inputs.tag || github.ref_name }}-x86_64-unknown-linux-gnu
          - name: macos-x64
            os: macos-15-intel
            archive: aurora-${{ inputs.tag || github.ref_name }}-x86_64-apple-darwin
          - name: macos-arm64
            os: macos-15
            archive: aurora-${{ inputs.tag || github.ref_name }}-aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: 1.95.0

      - name: Build release CLI
        run: cargo build -p aura --release --locked

      - name: Package CLI
        shell: bash
        run: scripts/package-cli.sh "${{ matrix.archive }}"

      - name: Smoke test packaged CLI outside the source tree
        shell: bash
        run: scripts/smoke-cli-archive.sh "${{ matrix.archive }}.tar.gz"

      - name: Upload CLI artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.archive }}
          path: ${{ matrix.archive }}.tar.gz
          if-no-files-found: error

  tools:
    name: VS Code extension and docs
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22.14.0
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Package VS Code extension
        run: npm run package:extension

      - name: Build docs
        env:
          VITEPRESS_BASE: /Aurora/
        run: npm run docs:build

      - name: Package docs
        shell: bash
        run: tar -czf aurora-docs-${{ inputs.tag || github.ref_name }}.tar.gz -C docs/.vitepress/dist .

      - name: Upload VS Code extension
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: aurora-language-vsix
          path: tools/vscode-aurora/aurora-language.vsix
          if-no-files-found: error

      - name: Upload docs artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: aurora-docs
          path: aurora-docs-${{ inputs.tag || github.ref_name }}.tar.gz
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [cli, tools]
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    permissions:
      contents: write

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: release-assets/*
