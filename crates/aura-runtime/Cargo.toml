[package]
name = "aura-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["rlib", "staticlib"]

[dependencies]
aura-core = { path = "../aura-core" }
base64 = "0.22"
corosensei = "0.3.3"
flate2 = { version = "1.1.11", default-features = false, features = ["zlib-rs"] }
getrandom = "0.2"
hashbrown = { version = "0.16", default-features = false }
httparse = "1"
libc = "0.2"
libffi = "5.1.1"
memchr = "2"
mio = { version = "0.8", features = ["os-ext", "os-poll", "net"] }
regex = "1.13.1"
rustls = { version = "0.23", default-features = false, features = ["logging", "ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision", "unbounded_depth"] }
sha2 = "0.10"
subtle = "2"
toml = "0.8"
tungstenite = { version = "0.25", features = ["rustls-tls-native-roots"] }
url = "2"
webpki-roots = "1"

[target.'cfg(windows)'.dependencies]
uds_windows = "1.1"
windows-sys = { version = "0.59", features = ["Win32_Foundation",
    "Win32_Media", "Win32_Networking_WinSock", "Win32_Security", "Win32_System_JobObjects", "Win32_System_LibraryLoader", "Win32_System_ProcessStatus", "Win32_System_Threading"] }

[features]
# Test hooks and corpora that aura-compiler's tests also use.
test-support = []

[dev-dependencies]
rcgen = "0.13"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage)'] }
