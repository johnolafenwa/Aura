[package]
name = "aura"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
aura-compiler = { path = "../aura-compiler" }
libc = "0.2"
serde_json = "1"

[features]
# Builds the LLVM code generator into `aura`; see aura-compiler.
llvm = ["aura-compiler/llvm"]

[dev-dependencies]
rcgen = "0.13"
