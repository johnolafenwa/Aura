[package]
name = "aurora-compiler"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["rlib", "staticlib"]

[dependencies]
base64 = "0.22"
cranelift-codegen = "0.118"
cranelift-frontend = "0.118"
cranelift-module = "0.118"
cranelift-native = "0.118"
cranelift-object = "0.118"
getrandom = "0.2"
httparse = "1"
libc = "0.2"
libffi = "5.1.1"
mio = { version = "0.8", features = ["os-ext", "os-poll", "net"] }
rustls = { version = "0.23", features = ["ring"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision", "unbounded_depth"] }
corosensei = "0.3.3"
sha2 = "0.10"
toml = "0.8"
tungstenite = { version = "0.24", features = ["rustls-tls-native-roots"] }
url = "2"
webpki-roots = "0.26"

[dev-dependencies]
rcgen = "0.13"

[[bench]]
name = "compiler_pipeline"
harness = false

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage)'] }
