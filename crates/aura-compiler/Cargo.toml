[package]
name = "aura-compiler"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["rlib", "staticlib"]

[dependencies]
aura-core = { path = "../aura-core" }
aura-runtime = { path = "../aura-runtime" }
cranelift-codegen = "0.118"
cranelift-frontend = "0.118"
cranelift-module = "0.118"
cranelift-native = "0.118"
cranelift-object = "0.118"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision", "unbounded_depth"] }
sha2 = "0.10"
toml = "0.8"

[dev-dependencies]
aura-core = { path = "../aura-core", features = ["test-support"] }
aura-runtime = { path = "../aura-runtime", features = ["test-support"] }
corosensei = "0.3.3"
getrandom = "0.2"
rcgen = "0.13"

[[bench]]
name = "compiler_pipeline"
harness = false

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage)'] }
