[package]
name = "aura-rust-baselines"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
publish = false

[dependencies]
tokio = { version = "=1.53.1", features = ["rt-multi-thread", "net", "io-util", "time"] }
serde_json = { version = "=1.0.149", optional = true }

[features]
# The cross-language programs in ../cross_language. Off by default, so the
# release-performance references build exactly as before.
cross-language = ["dep:serde_json", "tokio/sync"]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1

# Aura checks every integer operation, so the cross-language references keep
# Rust's overflow checks on as well.
[profile.cross-language]
inherits = "release"
overflow-checks = true

[[bin]]
name = "astar_pathfinding"
path = "../cross_language/astar_pathfinding/astar_pathfinding.rs"
required-features = ["cross-language"]

[[bin]]
name = "bank_ledger"
